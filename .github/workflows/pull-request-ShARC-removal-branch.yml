---
name: test_docs_build_ShARC_removal_branch
on:
  # Trigger on pull requests against the ShARC_removal branch
  pull_request:
    branches:
      - ShARC_removal
jobs:
  test_docs_build:
    runs-on: ubuntu-latest
    strategy:
      # Spawn and run a job for each of two supported Python 3.x versions
      matrix:
        python: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up a version of Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Upgrade pip and install Tox
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run tests using Tox
        run: tox -e py
